<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Maze Generator</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>2D Maze Generator</h1>
        <p class="subtitle">Generate and export mazes, courtesy of shanzcraft</p>

        <div class="main-content">
        <div class="controls">
            <div class="control-group">
                <button id="generateBtn">Generate</button>
            </div>

            <div class="control-group">
                <button id="solveBtn">Show Solution</button>
            </div>

            <div class="control-group" id="gridControl">
                <label>Grid Size (Rows × Cols)</label>
                <input type="number" id="gridSize" min="20" max="100" value="30">
            </div>

            <div class="control-group">
                <label>Maze Type</label>
                <select id="mazeType">
                    <option value="simple">Simply-Connected</option>
                    <option value="multiply">Multiply-Connected</option>
                </select>
            </div>

            <div class="control-group">
                <label>Line Thickness: <span id="thicknessValue">3</span>px</label>
                <input type="range" id="lineThickness" min="1" max="8" value="3">
            </div>

        </div>

        <div class="canvas-container">
            <canvas id="mazeCanvas" width="600" height="600"></canvas>
            <canvas id="solutionCanvas" width="600" height="600"></canvas>
        </div>
    </div>

        <div class="info">
            <h3 id="infoTitle">Simply-Connected Maze</h3>
            <p id="infoText">All walls connect to the boundary. These mazes can always be solved with the hand-on-wall method.</p>
        </div>
    </div>

    <footer>© 2026 Shannon Blitchok</footer>

    <script src="script.js"></script>
</body>
</html>
